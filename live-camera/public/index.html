<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Camera</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="container">

        <h1>📹 Live Camera</h1>

        <p class="subtitle">
            Live video and audio streaming
        </p>

        <div class="card">

            <h2>🎥 Camera</h2>

            <p>
                Use this device as the camera.
            </p>

            <a href="camera.html">
                <button>
                    Start Camera
                </button>
            </a>

        </div>


        <div class="card">

            <h2>📺 Viewer</h2>

            <p>
                Watch the live camera stream.
            </p>

            <a href="viewer.html">
                <button>
                    Watch Live
                </button>
            </a>

        </div>


        <p class="notice">
            🔴 Live streaming only<br>
            No recording • No video storage
        </p>

    </div>

</body>

</html>
